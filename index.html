<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OMDB Movie Search</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <nav class="navbar">
      <a href="#">Home</a>
      <a href="#">Search</a>
      <a href="#">About</a>
    </nav>

    <div class="search-container">
      <input
        id="searchInput"
        type="text"
        placeholder="Search by Title..."
        onchange="onSearchChange(event)"
      />
      <button onclick="runSearch(searchValue)">Search</button>
    </div>

    <div class="movies"></div>
  </body>
</html>
